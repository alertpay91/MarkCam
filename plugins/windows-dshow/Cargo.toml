[package]
name = "ovc-dshow"
description = "MarkCam DirectShow virtual-camera filter (Windows)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# cdylib: the COM in-proc server apps load (registered with regsvr32).
# rlib: lets `examples/probe.rs` drive the filter in-process without registration.
name = "markcam_dshow"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
ovc-ipc.workspace = true
# `#[implement]` expands to `::windows_core::` paths, so windows-core is a direct dep.
windows-core = "0.58.0"
windows = { workspace = true, features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
] }
