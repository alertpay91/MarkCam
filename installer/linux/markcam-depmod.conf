# MarkCam: when the kernel ships its own v4l2loopback (kernels from 7.0 on), use it rather
# than the older v4l2loopback-dkms build, which breaks on those kernels after the camera is
# reopened. Without the kernel's driver, the DKMS one is used as before.
override v4l2loopback * ubuntu/dkms/v4l2loopback
