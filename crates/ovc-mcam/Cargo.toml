[package]
name = "ovc-mcam"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# MarkCam's effect files: images and animations (PNG, APNG, JPG, GIF, WebP) + face placements.

[dependencies]
anyhow.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.140"

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Animated WebP decoded directly: image's wrapper never sets a background color, so frames
# that ask to be cleared ("dispose to background") stay on screen as ghosts.
image-webp = "0.2.4"
